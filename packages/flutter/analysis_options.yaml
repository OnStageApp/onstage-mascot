# No lint package dependency on purpose (tiny dependencies). These rules ship with the analyzer.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - example/build/**
    - build/**

linter:
  rules:
    - always_declare_return_types
    - annotate_overrides
    - avoid_print
    - avoid_relative_lib_imports
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_this
    - use_key_in_widget_constructors
    - use_super_parameters
